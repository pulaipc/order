<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Track Your Order — Pulai PC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #14110a;
            color: #f0e9d8;
            margin: 0;
            padding: 14px 14px 40px;
            box-sizing: border-box;
        }
        .container { max-width: 900px; margin: 0 auto; }

        .header-bar {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #3a3018; padding-bottom: 15px;
            margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .site-logo {
            display: block; width: 48px; height: 48px; border-radius: 50%;
            box-shadow: 0 0 0 2px #ffc000, 0 2px 8px rgba(0, 0, 0, 0.5); flex-shrink: 0;
        }
        h1 { color: #ffc000; margin: 0; font-size: 18px; line-height: 1.3; word-break: break-word; }
        .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-action {
            background: #2e2716; color: #ffc000; border: 1px solid #3a3018;
            padding: 8px 14px; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-family: inherit; font-size: 12.5px;
            text-decoration: none; line-height: normal;
            transition: all 0.2s; white-space: nowrap;
            display: inline-block;
        }
        .btn-action:hover { background: #ffc000; color: #14110a; border-color: #ffc000; }

        .search-card {
            background: #1f190e; border: 1px solid #3a3018; border-radius: 8px;
            padding: 18px; margin-bottom: 20px;
        }
        .search-card h2 { margin: 0 0 6px; color: #e8dcc0; font-size: 16px; }
        .search-card p { margin: 0 0 14px; color: #b8b0a0; font-size: 13px; line-height: 1.45; }
        .search-row { display: flex; gap: 8px; flex-wrap: nowrap; }
        .search-row input {
            flex: 1 1 auto; min-width: 0;
            padding: 12px; font-size: 16px; border-radius: 6px;
            border: 1px solid #3a3018; background: #221c10; color: #f0e9d8;
            box-sizing: border-box; outline: none;
            text-align: center; letter-spacing: 4px; font-weight: bold;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .search-row input:focus { border-color: #ffc000; }
        .search-row input:disabled { opacity: 0.5; cursor: not-allowed; }
        .search-row button {
            flex: 0 0 auto; background: #ffc000; color: #14110a;
            border: none; padding: 12px 18px; font-size: 14px; font-weight: bold;
            border-radius: 6px; cursor: pointer; font-family: inherit;
            min-height: 46px; transition: background 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .search-row button:hover:not(:disabled) { background: #e6ac00; }
        .search-row button:disabled { opacity: 0.6; cursor: not-allowed; }

        .status-msg {
            text-align: center; font-size: 13.5px; color: #e8dcc0;
            margin-bottom: 16px; min-height: 20px;
            transition: opacity 0.4s ease;
        }
        .status-msg.fading { opacity: 0; }

        .result-card {
            background: #1f190e; border: 1px solid #3a3018; border-radius: 8px;
            padding: 20px; display: none;
        }
        .result-card.show { display: block; }

        .result-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 10px; flex-wrap: wrap;
            padding-bottom: 16px; margin-bottom: 20px;
            border-bottom: 1px solid #2e2716;
        }
        .order-summary-left { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
        .order-id-line { font-size: 18px; font-weight: bold; color: #ffc000; }
        .order-detail-line { font-size: 13px; color: #b8b0a0; line-height: 1.5; }
        .order-detail-line strong { color: #e8dcc0; }

        .refresh-btn {
            background: #2e2716; color: #f0e9d8; border: 1px solid #3a3018;
            padding: 8px 14px; border-radius: 6px; cursor: pointer;
            font-size: 12.5px; font-weight: bold; font-family: inherit;
            display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
        }
        .refresh-btn:hover:not(:disabled) { background: #ffc000; color: #14110a; border-color: #ffc000; }
        .refresh-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .refresh-btn .spin {
            display: inline-block;
            transition: transform 0.4s;
        }
        .refresh-btn.loading .spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .result-header-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .copy-link-header-btn {
            background: #2e2716; color: #7dd3fc; border: 1px solid #3a3018;
            padding: 8px 14px; border-radius: 6px; cursor: pointer;
            font-size: 12.5px; font-weight: bold; font-family: inherit;
            display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s; white-space: nowrap;
        }
        .copy-link-header-btn:hover {
            background: #7dd3fc; color: #14110a; border-color: #7dd3fc;
        }

        .main-progress {
            display: flex; justify-content: space-between; align-items: flex-start;
            position: relative; margin: 20px 0 8px;
        }
        .main-progress::before {
            content: '';
            position: absolute;
            top: 20px; left: 8%; right: 8%; height: 3px;
            background: #2e2716; z-index: 0; border-radius: 2px;
        }
        .main-progress-line-fill {
            position: absolute;
            top: 20px; left: 8%; height: 3px;
            background: #ffc000; z-index: 1; border-radius: 2px;
            transition: width 0.6s ease;
        }
        .main-step {
            display: flex; flex-direction: column; align-items: center;
            gap: 8px; flex: 1; position: relative; z-index: 2; min-width: 0;
        }
        .main-step-icon {
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; background: #221c10; border: 3px solid #3a3018;
            color: #6a6357; transition: all 0.3s;
            box-sizing: border-box;
        }
        .main-step.completed .main-step-icon {
            background: #ffc000; border-color: #ffc000; color: #14110a;
        }
        .main-step.current .main-step-icon {
            background: #ffc000; border-color: #ffc000; color: #14110a;
            box-shadow: 0 0 0 4px rgba(255,192,0,0.2), 0 0 20px rgba(255,192,0,0.4);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(255,192,0,0.2), 0 0 20px rgba(255,192,0,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(255,192,0,0.1), 0 0 30px rgba(255,192,0,0.6); }
        }
        .main-step-label {
            font-size: 11px; color: #8a8272; text-align: center;
            line-height: 1.3; font-weight: 600; word-break: break-word;
        }
        .main-step.completed .main-step-label,
        .main-step.current .main-step-label { color: #e8dcc0; }

        .current-stage-card {
            background: #2a2108; border: 1px solid #7a6820;
            border-left: 4px solid #ffc000; border-radius: 6px;
            padding: 16px; margin-top: 20px;
        }
        .current-stage-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 15px; font-weight: bold; color: #e8dcc0;
            margin-bottom: 8px;
        }
        .current-stage-title .stage-icon { font-size: 22px; color: #ffc000; }
        .current-stage-desc {
            font-size: 13.5px; color: #e0d7b8; line-height: 1.55;
        }
        .current-stage-eta {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 12px; color: #7dd3fc; margin-top: 8px;
            background: rgba(125,211,252,0.08); padding: 4px 10px;
            border-radius: 4px; font-weight: 600;
        }
        .current-stage-updated {
            font-size: 11.5px; color: #8a8272; margin-top: 10px;
            padding-top: 10px; border-top: 1px solid #3a3018;
        }

        .substages {
            margin-top: 18px; padding-top: 16px;
            border-top: 1px solid #2e2716;
        }
        .substages-title {
            font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px;
            color: #e8dcc0; font-weight: 700; margin-bottom: 12px;
        }
        .substage-list {
            display: flex; flex-direction: column; gap: 8px;
        }
        .substage-item {
            display: flex; align-items: center; gap: 12px;
            background: #17120a; border: 1px solid #241e12;
            padding: 12px 14px; border-radius: 6px;
            font-size: 13.5px; transition: all 0.3s;
        }
        .substage-item.completed {
            background: #1c1808; border-color: #4a3d1a;
        }
        .substage-item.current {
            background: #2a2108; border: 1px solid #7a6820;
            border-left: 4px solid #ffc000;
        }
        .substage-icon {
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; flex-shrink: 0;
            background: #2e2716; color: #6a6357; border: 2px solid #3a3018;
            box-sizing: border-box;
        }
        .substage-item.completed .substage-icon {
            background: #ffc000; color: #14110a; border-color: #ffc000;
        }
        .substage-item.current .substage-icon {
            background: #ffc000; color: #14110a; border-color: #ffc000;
            box-shadow: 0 0 0 3px rgba(255,192,0,0.2);
        }
        .substage-content {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; gap: 3px;
        }
        .substage-name {
            color: #b8b0a0; font-weight: 500; word-break: break-word;
        }
        .substage-item.completed .substage-name,
        .substage-item.current .substage-name { color: #f0e9d8; font-weight: 600; }
        .substage-meta {
            font-size: 11.5px; color: #8a8272; line-height: 1.4;
        }
        .substage-item.current .substage-meta { color: #7dd3fc; }
        .substage-badge {
            font-size: 10px; font-weight: bold; text-transform: uppercase;
            letter-spacing: 0.5px; padding: 3px 8px; border-radius: 3px;
            background: #2e2716; color: #8a8272; flex-shrink: 0;
        }
        .substage-item.completed .substage-badge {
            background: rgba(255,192,0,0.15); color: #e8dcc0;
        }
        .substage-item.current .substage-badge {
            background: #ffc000; color: #14110a;
        }

        .substage-simple {
            background: #2a2108; border: 1px solid #7a6820;
            border-left: 4px solid #ffc000; border-radius: 6px;
            padding: 14px; margin-top: 18px;
            font-size: 13.5px; color: #e0d7b8; line-height: 1.5;
            display: flex; align-items: flex-start; gap: 12px;
        }
        .substage-simple .spin-icon {
            font-size: 22px; flex-shrink: 0;
            animation: spin 3s linear infinite;
            display: inline-block;
            color: #ffc000;
        }
        .substage-simple .substage-simple-content {
            flex: 1; min-width: 0;
        }

        .wa-button-wrap {
            margin-top: 22px; text-align: center;
        }
        .wa-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: #25D366; color: #fff;
            border: none; padding: 12px 22px; border-radius: 6px;
            font-weight: bold; font-size: 14px; font-family: inherit;
            cursor: pointer; text-decoration: none;
            transition: opacity 0.2s;
        }
        .wa-btn:hover { opacity: 0.85; }

        .cancelled-banner {
            background: #3a1212; border: 1px solid #7a3030;
            border-left: 4px solid #e57373; border-radius: 6px;
            padding: 16px; margin-top: 20px;
            display: flex; align-items: flex-start; gap: 12px;
        }
        .cancelled-banner .icon { font-size: 24px; flex-shrink: 0; color: #e57373; }
        .cancelled-banner .msg { font-size: 13.5px; color: #f5cdcd; line-height: 1.55; }
        .cancelled-banner .msg strong { color: #e57373; }

        .trust-footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #2e2716;
            text-align: center;
            font-size: 12px;
            color: #8a8272;
            line-height: 1.7;
        }
        .trust-footer .brand {
            color: #e8dcc0; font-weight: bold; margin-bottom: 6px;
            font-size: 13px;
        }
        .trust-footer a {
            color: #25D366; text-decoration: none;
        }
        .trust-footer a:hover { text-decoration: underline; }
        .trust-footer .note {
            margin-top: 4px; color: #6a6357; font-size: 11px;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #14110a; }
        ::-webkit-scrollbar-thumb { background: #3a3018; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #5a4a20; }

        @media (min-width: 600px) {
            body { padding: 20px 20px 40px; }
            .site-logo { width: 52px; height: 52px; }
            h1 { font-size: 20px; }
            .main-step-icon { width: 52px; height: 52px; font-size: 22px; }
            .main-step-label { font-size: 12.5px; }
            .main-progress::before, .main-progress-line-fill { top: 24px; }
        }
        @media (max-width: 380px) {
            body { padding: 10px 10px 40px; }
            .site-logo { width: 40px; height: 40px; }
            h1 { font-size: 15px; }
            .btn-action { padding: 7px 10px; font-size: 11px; }
            .main-step-icon { width: 36px; height: 36px; font-size: 15px; }
            .main-step-label { font-size: 9.5px; }
            .main-progress::before, .main-progress-line-fill { top: 16px; }
            .search-row button span { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <div class="header-left">
                <img src="logo.PNG" alt="Pulai PC Logo" class="site-logo">
                <h1>Track Your Order</h1>
            </div>
            <div class="header-actions">
                <a href="index.html" class="btn-action">Order Page</a>
            </div>
        </div>

        <div class="search-card">
            <h2>Enter your phone ID</h2>
            <p>Type the last 4 digits of your phone number to see your order's progress.</p>
            <div class="search-row">
                <input type="text" id="trackPhoneInput" maxlength="4" placeholder="e.g. 5678" inputmode="numeric" pattern="[0-9]*">
                <button id="trackBtn" onclick="trackOrder()">
                    <span>Track</span>
                </button>
            </div>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <div id="resultCard" class="result-card">
            <div class="result-header">
                <div class="order-summary-left">
                    <div class="order-id-line" id="summaryId">—</div>
                    <div class="order-detail-line" id="summaryDetail">—</div>
                    <div class="order-detail-line" id="summaryPlaced" style="font-size:11.5px; color:#8a8272; margin-top:4px;"></div>
                </div>
                <div class="result-header-actions">
                    <button class="copy-link-header-btn" id="copyLinkBtn" onclick="copyTrackerUrl(this)" title="Copy this tracking link">
                        Copy Link
                    </button>
                    <button class="refresh-btn" id="refreshBtn" onclick="refreshOrder()" title="Refresh status">
                        <span class="spin">&#8635;</span><span>Refresh</span>
                    </button>
                </div>
            </div>

            <div id="mainProgress" class="main-progress">
                <div class="main-progress-line-fill" id="progressLineFill"></div>
            </div>

            <div id="currentStageCard" class="current-stage-card">
                <div class="current-stage-title">
                    <span class="stage-icon" id="currentIcon">&#9679;</span>
                    <span id="currentStageName">In Progress</span>
                </div>
                <div class="current-stage-desc" id="currentStageDesc">—</div>
                <div id="currentStageEta" class="current-stage-eta" style="display:none;"></div>
                <div class="current-stage-updated" id="currentStageUpdated"></div>
            </div>

            <div id="substagesContainer"></div>

            <div class="wa-button-wrap">
                <a id="waChatBtn" class="wa-btn" href="#" target="_blank" rel="noopener noreferrer">
                    Chat on WhatsApp
                </a>
            </div>
        </div>

        <footer class="trust-footer">
            <div class="brand">Pulai PC</div>
            <div>Jailbreak &amp; Game Installation Service</div>
            <div style="margin-top: 6px;">
                WhatsApp: <a href="https://wa.me/601165676869">+60 11-6567 6869</a>
            </div>
            <div class="note">All orders are processed manually. Payment on pickup.</div>
        </footer>
    </div>

    <script src="config.js"></script>
    <script>
    const supabaseClient = supabase.createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseAnonKey);

    const $ = id => document.getElementById(id);
    let currentOrder = null;
    let currentPhone = null;

    const RATE_LIMIT = {
        maxAttempts: 5,
        windowMs: 10 * 60 * 1000,
        cooldownMs: 60 * 1000,
        storageKey: 'trackRateLimit'
    };

    function getRateState() {
        try {
            const raw = localStorage.getItem(RATE_LIMIT.storageKey);
            if (!raw) return { fails: [], lockedUntil: 0 };
            const parsed = JSON.parse(raw);
            return {
                fails: Array.isArray(parsed.fails) ? parsed.fails : [],
                lockedUntil: parsed.lockedUntil || 0
            };
        } catch {
            return { fails: [], lockedUntil: 0 };
        }
    }

    function saveRateState(state) {
        try { localStorage.setItem(RATE_LIMIT.storageKey, JSON.stringify(state)); } catch {}
    }

    function pruneOldFails(fails) {
        const cutoff = Date.now() - RATE_LIMIT.windowMs;
        return fails.filter(t => t > cutoff);
    }

    function checkRateLimit() {
        const state = getRateState();
        const now = Date.now();
        if (state.lockedUntil > now) {
            return { allowed: false, remainingMs: state.lockedUntil - now };
        }
        state.fails = pruneOldFails(state.fails);
        if (state.fails.length >= RATE_LIMIT.maxAttempts) {
            state.lockedUntil = now + RATE_LIMIT.cooldownMs;
            saveRateState(state);
            return { allowed: false, remainingMs: RATE_LIMIT.cooldownMs };
        }
        saveRateState(state);
        return { allowed: true, remainingMs: 0 };
    }

    function recordFailure() {
        const state = getRateState();
        state.fails = pruneOldFails(state.fails);
        state.fails.push(Date.now());
        if (state.fails.length >= RATE_LIMIT.maxAttempts) {
            state.lockedUntil = Date.now() + RATE_LIMIT.cooldownMs;
        }
        saveRateState(state);
    }

    function recordSuccess() {
        saveRateState({ fails: [], lockedUntil: 0 });
    }

    function applyRateLimitUI() {
        const btn = $('trackBtn');
        const input = $('trackPhoneInput');
        if (!btn) return false;

        const result = checkRateLimit();
        if (result.allowed) {
            btn.disabled = false;
            input.disabled = false;
            return false;
        }

        btn.disabled = true;
        input.disabled = true;
        const totalSec = Math.ceil(result.remainingMs / 1000);
        let remaining = totalSec;

        const tick = () => {
            if (remaining <= 0) {
                btn.disabled = false;
                input.disabled = false;
                setStatus('');
                return;
            }
            setStatus(`Too many attempts. Please wait ${remaining}s before trying again.`, '#e57373', 0);
            remaining--;
            setTimeout(tick, 1000);
        };
        tick();
        return true;
    }

    const STAGE_ICONS = {
        'Order Received':   '\u2022',
        'Confirmed':        '\u2713',
        'In Progress':      '\u25D0',
        'Ready for Pickup': '\u25D1',
        'Completed':        '\u2713',
        'Cancelled':        '\u2717'
    };

    window.onload = function() {
        applyRateLimitUI();

        const params = new URLSearchParams(window.location.search);
        const urlPhone = params.get('phone');
        if (urlPhone && urlPhone.length === 4 && /^\d{4}$/.test(urlPhone)) {
            $('trackPhoneInput').value = urlPhone;
            if (!checkRateLimit().allowed) {
                applyRateLimitUI();
            } else {
                trackOrder();
            }
        }
        $('trackPhoneInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') trackOrder();
        });
    };

    async function trackOrder() {
        const input = $('trackPhoneInput');
        const phone = input.value.trim();
        const btn = $('trackBtn');
        const statusMsg = $('statusMsg');

        const rl = checkRateLimit();
        if (!rl.allowed) {
            applyRateLimitUI();
            return;
        }

        if (phone.length !== 4 || !/^\d{4}$/.test(phone)) {
            setStatus('Please enter a valid 4-digit phone ID.', '#e57373');
            input.focus();
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span>Loading...</span>';
        setStatus('Looking up your order...', '#7dd3fc', 0);
        $('resultCard').classList.remove('show');

        try {
            const { data, error } = await supabaseClient
                .from('orders')
                .select('*')
                .eq('phone_ending', phone)
                .order('created_at', { ascending: false })
                .limit(1);

            if (error) throw error;

            if (!data || data.length === 0) {
                recordFailure();
                setStatus(`No order found for ID "${phone}". If you just placed one, please wait a moment and try again.`, '#ffb74d', 6000);
                $('resultCard').classList.remove('show');
                return;
            }

            recordSuccess();
            currentPhone = phone;
            currentOrder = data[0];
            renderTracker(data[0]);
            setStatus('');

        } catch (err) {
            console.error(err);
            recordFailure();
            setStatus('Could not load your order. Please try again.', '#e57373', 6000);
        } finally {
            const post = checkRateLimit();
            if (post.allowed) {
                btn.disabled = false;
                btn.innerHTML = '<span>Track</span>';
            } else {
                applyRateLimitUI();
            }
        }
    }

    async function refreshOrder() {
        if (!currentPhone) return;
        const btn = $('refreshBtn');
        btn.disabled = true;
        btn.classList.add('loading');
        try {
            const { data, error } = await supabaseClient
                .from('orders')
                .select('*')
                .eq('phone_ending', currentPhone)
                .order('created_at', { ascending: false })
                .limit(1);
            if (error) throw error;
            if (data && data.length > 0) {
                currentOrder = data[0];
                renderTracker(data[0]);
                setStatus('Status updated.', '#00e676', 3000);
            }
        } catch (err) {
            console.error(err);
            setStatus('Could not refresh. Please try again.', '#e57373', 4000);
        } finally {
            btn.disabled = false;
            btn.classList.remove('loading');
        }
    }

    function copyTrackerUrl(btnElement) {
        if (!currentPhone) {
            alert('No active order to copy.');
            return;
        }
        const url = window.location.origin + window.location.pathname + '?phone=' + encodeURIComponent(currentPhone);
        navigator.clipboard.writeText(url).then(() => {
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = 'Copied';
            btnElement.style.background = '#7dd3fc';
            btnElement.style.color = '#14110a';
            btnElement.style.borderColor = '#7dd3fc';
            setTimeout(() => {
                btnElement.innerHTML = originalText;
                btnElement.style.background = '#2e2716';
                btnElement.style.color = '#7dd3fc';
                btnElement.style.borderColor = '#3a3018';
            }, 2000);
        }).catch(err => {
            alert('Failed to copy link: ' + err);
        });
    }

    function setStatus(text, color = '#e8dcc0', autoDismissMs = 0) {
        const el = $('statusMsg');
        el.classList.remove('fading');
        el.style.color = color;
        el.innerText = text;
        if (autoDismissMs > 0) {
            setTimeout(() => {
                el.classList.add('fading');
                setTimeout(() => { if (el.classList.contains('fading')) { el.innerText = ''; el.classList.remove('fading'); } }, 400);
            }, autoDismissMs);
        }
    }

    function renderTracker(order) {
        $('summaryId').innerText = `Order #${order.phone_ending || 'N/A'}`;

        const serviceLabels = {
            'jailbreak': `Full Jailbreak${order.console_model ? ' (' + order.console_model + ')' : ''}`,
            'system_setup': 'System Setup',
            'games_only': 'Games Only'
        };
        const serviceLabel = serviceLabels[order.service_type] || 'Order';

        const gameCount = Array.isArray(order.games) ? order.games.length : 0;
        const sizeGb = order.total_size_gb ? Number(order.total_size_gb).toFixed(1) : '0';

        $('summaryDetail').innerHTML = `${serviceLabel} &nbsp;·&nbsp; <strong>${gameCount}</strong> games &nbsp;·&nbsp; <strong>${sizeGb}</strong> GB`;
        $('summaryPlaced').innerHTML = order.created_at
            ? `Placed: ${new Date(order.created_at).toLocaleString('en-MY', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true })}`
            : '';

        const stages = APP_CONFIG.progressStages || ['Order Received','Confirmed','In Progress','Ready for Pickup','Completed'];
        let currentStage = order.progress_stage || 'Order Received';
        if (order.status === 'Cancelled') currentStage = 'Cancelled';

        const mainProgress = $('mainProgress');
        mainProgress.querySelectorAll('.main-step').forEach(el => el.remove());

        const currentIndex = stages.indexOf(currentStage);

        stages.forEach((stage, idx) => {
            const isCompleted = (currentIndex > -1 && idx < currentIndex);
            const isCurrent = (idx === currentIndex);
            const step = document.createElement('div');
            step.className = 'main-step' + (isCompleted ? ' completed' : '') + (isCurrent ? ' current' : '');

            const icon = document.createElement('div');
            icon.className = 'main-step-icon';
            icon.innerText = isCompleted ? '\u2713' : (STAGE_ICONS[stage] || '\u2022');

            const label = document.createElement('div');
            label.className = 'main-step-label';
            label.innerText = stage;

            step.appendChild(icon);
            step.appendChild(label);
            mainProgress.appendChild(step);
        });

        const lineFill = $('progressLineFill');
        if (currentIndex <= 0 || stages.length <= 1) {
            lineFill.style.width = '0%';
        } else {
            const usablePercent = 84;
            const stepCount = stages.length - 1;
            const percent = (currentIndex / stepCount) * usablePercent;
            lineFill.style.width = percent + '%';
        }

        const currentCard = $('currentStageCard');
        const waWrap = document.querySelector('.wa-button-wrap');
        const etaBox = $('currentStageEta');

        if (currentStage === 'Cancelled') {
            currentCard.style.display = 'none';
            $('substagesContainer').innerHTML = `<div class="cancelled-banner">
                <span class="icon">&#10007;</span>
                <div class="msg">
                    <strong>Order Cancelled.</strong><br>
                    This order has been cancelled. If you believe this is a mistake, please contact us on WhatsApp.
                </div>
            </div>`;
            waWrap.style.display = 'block';
        } else {
            currentCard.style.display = 'block';
            $('currentIcon').innerText = STAGE_ICONS[currentStage] || '\u25CF';
            $('currentStageName').innerText = currentStage;
            $('currentStageDesc').innerText = (APP_CONFIG.progressDescriptions && APP_CONFIG.progressDescriptions[currentStage]) || '';

            if (order.progress_updated_at) {
                $('currentStageUpdated').innerHTML = `Last updated: <strong>${formatTimeAgo(order.progress_updated_at)}</strong>`;
            } else {
                $('currentStageUpdated').innerText = '';
            }

            const substagesContainer = $('substagesContainer');
            substagesContainer.innerHTML = '';
            etaBox.style.display = 'none';

            if (currentStage === 'In Progress') {
                const serviceType = order.service_type || '';
                const stagesList = (APP_CONFIG.subStagesByService && APP_CONFIG.subStagesByService[serviceType]) || [];
                const currentSub = order.progress_substage || (stagesList[0] || null);
                const currentSubIdx = stagesList.indexOf(currentSub);

                if (APP_CONFIG.showEstimatedTime && currentSub && APP_CONFIG.subStageEstimatedTimes && APP_CONFIG.subStageEstimatedTimes[currentSub]) {
                    etaBox.innerHTML = `Estimated time: <strong>${APP_CONFIG.subStageEstimatedTimes[currentSub]}</strong>`;
                    etaBox.style.display = 'inline-flex';
                }

                if (stagesList.length > 1) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'substages';
                    wrapper.innerHTML = `<div class="substages-title">Work in progress — detailed steps</div>`;

                    const list = document.createElement('div');
                    list.className = 'substage-list';

                    stagesList.forEach((sub, idx) => {
                        const isDone = (idx < currentSubIdx);
                        const isCur = (idx === currentSubIdx);

                        const item = document.createElement('div');
                        item.className = 'substage-item' + (isDone ? ' completed' : '') + (isCur ? ' current' : '');

                        let metaLine = '';
                        if (sub === 'Game Installation' && isCur && !isDone) {
                            const gc = Array.isArray(order.games) ? order.games.length : 0;
                            const gs = order.total_size_gb ? Number(order.total_size_gb).toFixed(1) : '0';
                            if (gc > 0) {
                                metaLine = `Installing ${gc} game${gc !== 1 ? 's' : ''} · ${gs} GB total`;
                            }
                        }

                        item.innerHTML = `
                            <div class="substage-icon">${isDone ? '&#10003;' : (isCur ? '&#9680;' : '&#9675;')}</div>
                            <div class="substage-content">
                                <div class="substage-name">${sub}</div>
                                ${metaLine ? `<div class="substage-meta">${metaLine}</div>` : ''}
                            </div>
                            <div class="substage-badge">${isDone ? 'Done' : (isCur ? 'Now' : 'Pending')}</div>
                        `;
                        list.appendChild(item);
                    });

                    wrapper.appendChild(list);
                    substagesContainer.appendChild(wrapper);
                } else if (stagesList.length === 1) {
                    const simple = document.createElement('div');
                    simple.className = 'substage-simple';
                    const desc = (APP_CONFIG.subStageDescriptions && APP_CONFIG.subStageDescriptions[stagesList[0]]) || 'Working on it...';

                    const gc = Array.isArray(order.games) ? order.games.length : 0;
                    const gs = order.total_size_gb ? Number(order.total_size_gb).toFixed(1) : '0';
                    let detail = '';
                    if (gc > 0) detail = `<div style="margin-top:6px; font-size:12.5px; color:#7dd3fc; font-weight:600;">Installing ${gc} game${gc !== 1 ? 's' : ''} · ${gs} GB total</div>`;

                    simple.innerHTML = `
                        <span class="spin-icon">&#8635;</span>
                        <div class="substage-simple-content">
                            <div>${desc}</div>
                            ${detail}
                        </div>
                    `;
                    substagesContainer.appendChild(simple);
                }
            }
        }

        const wa = APP_CONFIG.whatsappNumber || '';
        const waBtn = $('waChatBtn');
        if (wa) {
            const prefill = `Hi, I'd like to ask about my order #${order.phone_ending || ''}.`;
            waBtn.href = `https://wa.me/${wa}?text=${encodeURIComponent(prefill)}`;
            waBtn.style.display = 'inline-flex';
        } else {
            waBtn.style.display = 'none';
        }

        $('resultCard').classList.add('show');
    }

    function formatTimeAgo(isoString) {
        const then = new Date(isoString).getTime();
        const now = Date.now();
        const sec = Math.floor((now - then) / 1000);
        if (sec < 60) return 'just now';
        const min = Math.floor(sec / 60);
        if (min < 60) return `${min} min ago`;
        const hr = Math.floor(min / 60);
        if (hr < 24) return `${hr} hour${hr !== 1 ? 's' : ''} ago`;
        const day = Math.floor(hr / 24);
        if (day < 30) return `${day} day${day !== 1 ? 's' : ''} ago`;
        const mo = Math.floor(day / 30);
        return `${mo} month${mo !== 1 ? 's' : ''} ago`;
    }
    </script>
